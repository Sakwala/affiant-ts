# Publishing to npm — the separate, deliberate step README.md describes.
#
# Nothing here fires on a push or a tag. A maintainer dispatches it by hand, and it
# defaults to a dry run: the whole pipeline executes and `pnpm publish --dry-run`
# prints the tarball each package would have uploaded, without uploading anything.
# A real upload additionally needs the word `publish` typed into the `confirm`
# input, so a stray click on "Run workflow" cannot put a version on the registry.
#
# Five packages go: `@affiant/contract`, `@affiant/core`, `@affiant/evidence-card`,
# `@affiant/store-postgres` and `@affiant/adapter-ai-sdk`, at the `alpha` dist-tag
# their own `publishConfig` already names. The last two have never been on the
# registry; the first three are there at `0.1.0-alpha.1`.
# `@affiant/conformance-driver` is `private: true` and is not among them, as the
# samples and the spike are not — the driver is the check on the claim, not part of
# what is claimed.
#
# The gate in front of the upload is this repository's own. `@affiant/core`'s
# `prepack` script refuses to pack at all until `AFFIANT_ALLOW_PUBLISH=1` is set,
# because the stated conditions for publishing it were a public parity report for
# both implementations and a green, merge-blocking conformance driver. Those
# conditions hold at the rulebook's v0.2.0 tag, the ref packages/contract/protocol/PIN
# names — the .NET parity report at
# https://github.com/Sakwala/affiant-protocol/blob/v0.2.0/conformance/parity/dotnet-v0.1.json
# and this package's own
# packages/conformance-driver/conformance/parity/typescript-v0.2.json — so this
# workflow sets the variable —
# and re-proves the second one a few steps earlier, on all three runtimes, rather
# than taking the required check on `main` on trust. `--ignore-scripts` is therefore
# never passed to the pack: skipping the guard would skip the reason.
# `@affiant/store-postgres` and `@affiant/adapter-ai-sdk` carry the same guard, so
# that no ordinary `npm pack` or `npm publish` of either is possible either.
#
# Authentication: npm trusted publishing, not a token. The exchange below succeeds
# only where the registry carries a trusted-publisher entry naming this repository
# and this workflow filename for the package being published; the three entries on
# npmjs.com name the owner `Sakwala`, the repository `affiant-ts`, this file and
# no environment, and permit a direct `npm publish`. The job's OIDC token
# (`id-token: write`) is exchanged for a short-lived, package-scoped credential at
# publish time, which is how `0.1.0-alpha.1` went up on 2026-09-10 in run
# 34542413066. There is no `NPM_TOKEN` in this file and no `NODE_AUTH_TOKEN` in
# the environment. npm's requirements for that exchange are npm CLI >= 11.5.1,
# Node >= 22.14.0, `id-token: write`, and a workflow filename that matches the one
# registered on npmjs.com exactly — so this file's name is load bearing, and the
# npm CLI is upgraded below rather than taken as whatever the runner image
# happened to ship. Provenance comes with it: a trusted publish attaches a signed
# statement binding each tarball to this repository, this workflow and this
# commit, without being asked.
#
# A package that has never been on the registry cannot have such an entry yet. npm's
# API documents the same Requirements block on all three trusted-publisher operations,
# opening with "Package MUST exist" (api-docs.npmjs.com, `configureTrustedPublisher`),
# and the CLI page for `npm trust` says it in words: "Package must exist: The package
# you're configuring must already exist on the npm registry."
# (https://docs.npmjs.com/cli/v11/commands/npm-trust/). So `@affiant/store-postgres`
# and `@affiant/adapter-ai-sdk` need one publish under a credential a person holds
# before this workflow can publish them, and until that has happened their two
# preflight lines below will report a refused exchange rather than a 2xx. The
# credential for that first publish is an **interactive 2FA login**: a granular access
# token with `bypass_2fa` can publish, but npm's API refuses it on the operation that
# registers the trusted publisher afterwards — "Granular Access Tokens with
# `bypass_2fa: true` are not permitted to call this endpoint and receive 403
# Forbidden" (api-docs.npmjs.com, `configureTrustedPublisher`) — so a token that
# bootstraps the package cannot then hand the job to this workflow.
#
# Why the real upload runs the npm CLI directly. pnpm 10 has no OIDC implementation
# of its own — `pnpm publish` packs the package and shells out to whatever `npm` is
# on PATH, so the trusted-publishing exchange is the npm CLI's either way. Going
# through pnpm adds a temporary working directory and a copied `.npmrc` to a step
# that cannot be rehearsed anywhere but a real release, and pnpm needed two later
# fixes (11.0.7 and 11.1.3) before that indirection was reliable. So the real path
# packs with pnpm — which is what rewrites the `workspace:^` range on
# `@affiant/contract` into `^0.1.0-alpha.1`, and what runs the `prepack` guard — and
# then hands each finished tarball to `npm publish`, in dependency order.
#
# The dry run still goes through `pnpm -r publish --dry-run`, unchanged: it needs no
# credential. Reporting which versions the registry already has is no longer
# dry-run-only — the real path asks the registry the same question, per package,
# immediately before each publish.
#
# Why the exchange is proved before the upload, and why the upload still hands npm
# a tarball. Two dispatches of this workflow, on 2026-09-09 and 2026-09-10, failed
# at `npm publish` with ENEEDAUTH having printed nothing about OIDC or trusted
# publishing, which reads as though the exchange had never been attempted. It does
# not mean that. In npm 12.0.2 — the version the assert step above installs —
# `lib/commands/publish.js:152` calls the OIDC helper unconditionally, before the
# credential check that raises ENEEDAUTH at line 171, and the argument's spec type
# is consulted only for lifecycle scripts (lines 103 and 222) and for reading the
# manifest (line 296). A tarball path and a package directory take the same
# authentication path. The helper itself, `lib/utils/oidc.js`, is documented never
# to throw (lines 14-15) and reports every one of its exits — no id-token
# permission in the environment (line 67), a refused exchange request (line 126),
# an exchange answer carrying no token (line 131) — at the `verbose` or `silly`
# level, which npm's default `notice` loglevel does not print. The missing line was
# evidence of nothing; `--loglevel verbose` below makes it evidence of something.
#
# The preflight step in front of the upload performs the same exchange npm
# performs — the same audience, the same endpoint, the `npm-command` header
# `npm-registry-fetch` sends (`lib/index.js:232`) — and prints the registry's own
# answer for each of the five packages. A refused exchange names its own cause, on
# the dry run as much as on the real one, instead of arriving as ENEEDAUTH after
# the tarballs are built. The exchanged token is masked and never printed.
#
# Publishing each package from its own directory instead would not have changed the
# authentication, and would have broken two of the five: `@affiant/core` and
# `@affiant/evidence-card` depend on `@affiant/contract` at `workspace:^`, and npm
# has no rewriting of that protocol anywhere in its publish path — the range would
# reach the registry verbatim. pnpm's pack is what turns it into `^0.1.0-alpha.1`,
# which is why the tarballs stay. The two newest packages need that rewriting for a
# different reason: nothing they ship at runtime is a workspace range — `@affiant/core`
# is a peer dependency of each, at a published range, and neither declares a runtime
# dependency at all — but both carry `workspace:` ranges in `devDependencies`, and
# `@affiant/store-postgres` carries one on `@affiant/conformance-driver`, which is
# `private: true` and has no published version. pnpm's pack rewrites those too, so the
# store's published manifest names `@affiant/conformance-driver: ^0.1.0-alpha.0`, a
# version nobody can install. It is inert — a consumer installs a dependency's
# `dependencies` and its `peerDependencies`, never its `devDependencies` — but it is in
# the manifest, and the sentence that said otherwise was wrong.

name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything and `pnpm publish --dry-run`; nothing is uploaded"
        type: boolean
        default: true
      confirm:
        description: "Type `publish` to upload; ignored when dry_run is true"
        type: string
        default: ""

permissions:
  contents: read
  # The credential itself. npm exchanges this token for a short-lived, package-scoped
  # one, and signs the provenance statement with the same claims.
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # `pnpm test` below runs every package's suite, and `@affiant/store-postgres`
    # measures its statements against a real Postgres rather than a fake — so the
    # release run needs the same service the `ci` workflow gives its jobs, on the
    # same port 5433, or the verification this workflow does before it uploads
    # would stop at a store suite that could not open a database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orrery
          POSTGRES_PASSWORD: orrery
          POSTGRES_DB: orrery
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U orrery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # A shallow checkout is enough: the `prepack` guard reads an environment
      # variable, not git history, and provenance is built from the OIDC claims.
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # No `registry-url`/`scope` here on purpose. Those write an `.npmrc` holding
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, and with the token
      # gone the placeholder no longer resolves — pnpm warned about it on every run
      # and the literal string could reach the registry as a bearer token. Trusted
      # publishing needs no `.npmrc`; the default registry is the right one.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # The conformance suite below runs on every runtime this implementation
      # claims, and Bun is the one the runner does not already have.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Trusted publishing landed in npm 11.5.1. The runner image ships whichever
      # npm came with its Node build, so the version is raised and then asserted —
      # an older CLI does not fail loudly, it quietly falls back to looking for a
      # token that is not there.
      - name: npm CLI >= 11.5.1 (required for trusted publishing)
        run: |
          set -eo pipefail
          npm install -g npm@latest
          version=$(npm --version)
          echo "npm $version"
          if [ "$(printf '%s\n11.5.1\n' "$version" | sort -V | head -1)" != "11.5.1" ]; then
            echo "npm $version is older than the 11.5.1 trusted publishing needs" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # The same drift check `ci` makes: the three committed generated modules must
      # be exactly what the generator produces from packages/contract/protocol/. A
      # tarball whose schemas module describes a different protocol ref than the
      # vendored one would be undetectable once published.
      - run: pnpm -C packages/contract generate
      - run: >
          git diff --exit-code --
          packages/contract/src/schemas.ts
          packages/contract/src/conformance.ts
          packages/contract/test/fixtures.generated.ts

      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

      # The protocol's conformance suite against `@affiant/core`, with the failing
      # set asserted equal to the published parity manifest in both directions — the
      # condition `prepack` is guarding, re-established in the run that publishes.
      # All three runtimes, because the claim is that the failing set is identical on
      # each, and a single-runtime check would not be that claim.
      - name: conformance (node)
        run: pnpm -C packages/conformance-driver test

      - name: conformance (bun)
        run: bun run --bun vitest run --project conformance-driver

      - name: conformance (workerd)
        run: pnpm -C packages/conformance-driver test:workers

      # Everything above this line runs identically for a dry run and for a real
      # one. This is the only step that tells them apart, and it is deliberately
      # after the checks: a mistyped confirmation still leaves a full green
      # verification run behind, and a version can only reach the registry when a
      # person typed the word.
      - name: confirm a real publish
        if: inputs.dry_run != true && inputs.confirm != 'publish'
        run: |
          echo "dry_run is false, so this run would upload to npm, but the confirm" >&2
          echo "input was not the word 'publish'. Re-dispatch with confirm=publish" >&2
          echo "to upload, or leave dry_run checked to rehearse it." >&2
          exit 1

      # The credential, proved before anything is built. This asks GitHub for the
      # same id token npm asks for — the audience is `npm:` and the registry's
      # hostname, as `lib/utils/oidc.js:74` composes it — and offers it to the same
      # exchange endpoint (`lib/utils/oidc.js:120`) for each package that is about
      # to go. A 2xx answer means the registry recognises this repository, this
      # workflow filename and this package; anything else is printed with the
      # registry's own message, which is the sentence npm's helper swallows at
      # `verbose` (`lib/utils/oidc.js:126`). Nothing is published here and no token
      # is printed on success: the exchanged credential is short lived and package
      # scoped, and the id token itself is masked the moment it exists — before the
      # first line that could contain it. Before any exchange, the id token's own
      # claims are decoded and printed (not the token), so the identity the
      # registry is about to see is legible in the log rather than trusted blind.
      #
      # It reports and does not fail. npm's own exchange in the step below is the
      # authority on whether this job can publish, and a diagnostic that guessed
      # wrong should never stop a release npm itself could authenticate. A refusal
      # is a warning annotation; the upload then stops on its own, because a
      # credential that was never issued raises ENEEDAUTH.
      #
      # Each package is asked twice, because a trusted publisher is registered for
      # particular actions. npm sends the command's own name in the `npm-command`
      # header (`lib/npm.js:419`, and `lib/index.js:232` of npm-registry-fetch):
      # `npm publish` sends `publish`, and `npm stage publish` sends `stage`, the
      # name its command class carries (`lib/commands/stage/index.js`). npm's
      # documentation records that a trusted publisher registered after 2026-09-03
      # allows `npm stage publish` and permits direct `npm publish` only when that
      # action was chosen, so `stage` answering where `publish` does not is a fact
      # worth reading in the log rather than inferring.
      - name: trusted publishing preflight
        run: |
          set -eo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "no OIDC request URL or token in the environment: this job does not" >&2
            echo "have \`id-token: write\`, and npm's helper would skip the exchange" >&2
            echo "silently (lib/utils/oidc.js:67)." >&2
            exit 1
          fi
          id_token=$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              --header "Accept: application/json" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm%3Aregistry.npmjs.org" \
            | node -e '
              let body = ""
              process.stdin.on("data", chunk => { body += chunk })
              process.stdin.on("end", () => {
                const value = JSON.parse(body).value
                if (!value) {
                  console.error("the id-token response carried no value")
                  process.exit(1)
                }
                process.stdout.write(value)
              })
            '
          )
          echo "::add-mask::$id_token"
          ID_TOKEN="$id_token" node -e '
            const claims = [
              "repository", "repository_owner", "job_workflow_ref", "workflow_ref",
              "environment", "ref", "sub", "aud",
            ]
            const payload = JSON.parse(
              Buffer.from(process.env.ID_TOKEN.split(".")[1], "base64url").toString("utf8")
            )
            for (const claim of claims) {
              console.log(`${claim}: ${claim in payload ? payload[claim] : "(absent)"}`)
            }
          '
          for package in contract core evidence-card store-postgres adapter-ai-sdk; do
            for command in publish stage; do
              body="$RUNNER_TEMP/exchange-$package-$command.json"
              status=$(
                curl --silent --show-error --output "$body" --write-out '%{http_code}' \
                  --request POST \
                  --header "Authorization: Bearer $id_token" \
                  --header "npm-command: $command" \
                  "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@affiant%2f$package"
              )
              case "$status" in
                2*)
                  echo "@affiant/$package: the registry exchanged the id token for \`npm $command\` (HTTP $status; the token is not printed)"
                  ;;
                *)
                  echo "::warning::@affiant/$package: the registry refused the exchange for \`npm $command\` (HTTP $status): $(tr -d '\n' < "$body")"
                  ;;
              esac
            done
          done

      # `AFFIANT_ALLOW_PUBLISH=1` is the override `packages/core/scripts/prepack-guard.mjs`
      # documents, for the release that runs once the scope exists. The guard still
      # executes on both paths — `pnpm publish` and `pnpm pack` each run `prepack`,
      # and it prints which package it is packing — and it would still stop the
      # publish if the variable were absent.
      #
      # On the real path up to five tarballs are published, in dependency order:
      # `@affiant/contract` first, because `@affiant/core` and `@affiant/evidence-card`
      # depend on it, and those two before `@affiant/store-postgres` and
      # `@affiant/adapter-ai-sdk`, which name `@affiant/core` as a peer. A version the
      # registry already serves is skipped with a `::notice::` rather than
      # re-uploaded. Each upload that does happen runs at `--loglevel verbose`
      # because that is the only level at which npm's OIDC helper says anything at
      # all about what it did.
      - name: publish
        run: |
          set -eo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm -r publish \
              --access public --tag alpha --no-git-checks --provenance --dry-run \
              2>&1 | tee "$RUNNER_TEMP/publish.log"
          else
            tarballs="$RUNNER_TEMP/tarballs"
            mkdir -p "$tarballs"
            pnpm \
              --filter '@affiant/contract' \
              --filter '@affiant/core' \
              --filter '@affiant/evidence-card' \
              --filter '@affiant/store-postgres' \
              --filter '@affiant/adapter-ai-sdk' \
              pack --pack-destination "$tarballs" \
              2>&1 | tee "$RUNNER_TEMP/publish.log"
            for package in contract core evidence-card store-postgres adapter-ai-sdk; do
              matches=("$tarballs/affiant-$package-"*.tgz)
              if [ "${#matches[@]}" -ne 1 ] || [ ! -f "${matches[0]}" ]; then
                echo "expected exactly one tarball for @affiant/$package," >&2
                echo "found: ${matches[*]}" >&2
                exit 1
              fi
              tarball="${matches[0]}"
              name_version=$(
                tar -xOf "$tarball" package/package.json \
                  | node -p 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); p.name + "@" + p.version'
              )
              # A re-dispatch after a partial failure would otherwise fail here: the
              # registry refuses a version that is already published, and the
              # packages after the one that already landed would never get retried.
              # `npm view` on a version that is not there exits non-zero (E404); the
              # `if` guards that from tripping `set -e`, and only an exact-version
              # hit — the spec above already pins the version — counts as "exists".
              if npm view "$name_version" version --json >/dev/null 2>&1; then
                echo "::notice::$name_version is already on the registry; skipped"
                continue
              fi
              npm publish "$tarball" --access public --tag alpha --provenance \
                --loglevel verbose \
                2>&1 | tee -a "$RUNNER_TEMP/publish.log"
            done
          fi
        env:
          NPM_CONFIG_PROVENANCE: true
          AFFIANT_ALLOW_PUBLISH: 1

      # What went, or what would have gone. For a dry run that is the tarball file
      # list `npm notice` printed for each package, which is the only place the
      # `files` field of a manifest can be checked before it is permanent; for a real
      # one it is the registry's own answer, read back rather than assumed.
      - name: what was published
        run: |
          set -eo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            {
              echo "### Dry run — nothing was uploaded"
              echo
              echo "Each tarball below is what \`pnpm publish\` would have sent."
              echo
              echo '```'
              sed -n 's/^npm notice //p' "$RUNNER_TEMP/publish.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### At the \`alpha\` dist-tag after this run"
              echo
              for package in contract core evidence-card store-postgres adapter-ai-sdk; do
                echo "- \`@affiant/$package\` — $(npm view "@affiant/$package@alpha" version)"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi
