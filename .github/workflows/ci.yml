name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: node 22
    runs-on: ubuntu-latest
    # `@affiant/store-postgres` is measured against a real Postgres, because the
    # rules it has to hold — the guarded compare-and-set, the tenant policies, the
    # deadline applied on read — are properties of the statements and not of a fake.
    # Port 5433 so the package's default admin URL needs no override anywhere.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orrery
          POSTGRES_PASSWORD: orrery
          POSTGRES_DB: orrery
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U orrery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The three committed generated modules must be exactly what the generator
      # produces from packages/contract/protocol/. Regenerating them here and
      # failing on any diff is what stops a `sync-protocol` without a `generate`
      # from merging a schemas module that describes the previous protocol ref.
      - run: pnpm -C packages/contract generate
      - run: >
          git diff --exit-code --
          packages/contract/src/schemas.ts
          packages/contract/src/conformance.ts
          packages/contract/test/fixtures.generated.ts
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      # `prettier --check`, plus each package's own lint — for `@affiant/core`
      # that is the RT-3 tripwire that keeps Durable Object storage unreachable.
      - run: pnpm lint

  bun:
    name: bun
    runs-on: ubuntu-latest
    # The Docket store files real entries under Bun too, and its line here blocks.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orrery
          POSTGRES_PASSWORD: orrery
          POSTGRES_DB: orrery
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U orrery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      # `@affiant/core`'s runtime suite imports the package through its published
      # entry points, so the workspace is built before the suites run.
      - run: pnpm build
      # The wire types and the vendored fixtures must hold on Bun's runtime too,
      # so the contract package's fixture and schema suites run under Bun.
      - run: bun run --bun vitest run --project contract
      # RT-1: the core is runtime-neutral, so its whole suite runs under Bun.
      - run: bun run --bun vitest run --project core
      # The AI SDK adapter blocks here too. It was best-effort while nothing had
      # measured it under Bun; its whole suite — the gated tool path, the agent
      # loop, the inference port and the packed consumer — passes, so a red run is
      # a gate rather than a report, like the other two runtimes it claims.
      - run: bun run --bun vitest run --project adapter-ai-sdk
      # The Docket store under Bun, which is where the driver resolves a build of its
      # own — the one thing about this package that is not the same code on all three
      # runtimes, and therefore the one worth a job that can go red.
      - run: bun run --bun vitest run --project store-postgres

  workerd:
    name: workerd
    runs-on: ubuntu-latest
    # The store's contract suite runs inside workerd against this, over TCP.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orrery
          POSTGRES_PASSWORD: orrery
          POSTGRES_DB: orrery
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U orrery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `@affiant/core`'s runtime suite imports the package through its published
      # entry points, so the workspace is built before the suites run.
      - run: pnpm build
      # The same fixture and schema suites, executed inside workerd — the runtime
      # a Cloudflare Worker host would run this package on.
      - run: pnpm -C packages/contract test:workers
      # RT-1 again: the core's runtime-neutral suites, inside workerd.
      - run: pnpm -C packages/core test:workers
      # The AI SDK adapter has no I/O of its own, so every behavioural suite it has
      # runs inside workerd too — the runtime its first host executes on.
      - run: pnpm -C packages/adapter-ai-sdk test:workers
      # The Docket store's contract suite, inside workerd, over a direct TCP
      # connection to the service container — the runtime a Worker host would run it
      # on, and the one it was written for.
      - run: pnpm -C packages/store-postgres test:workers

  # The protocol's conformance suite, run against @affiant/core on every runtime
  # this implementation claims — and, from protocol v0.2.0, the adapter fixture
  # section run against @affiant/adapter-ai-sdk beside it, because a driver runs
  # that section once for every adapter its implementation ships and declares. The
  # failing set is asserted equal to the published parity manifest over the UNION
  # of the two sections — in both directions.
  #
  # REQUIRED on `main`: a red run here cannot merge. That is the whole point. An
  # empty `failing[]` is a published claim about this implementation, and a claim
  # nothing enforces is a press release. The three runtimes are one job on purpose:
  # RT-1 says the failing set must be identical on each, and a matrix would let one
  # runtime's job be red while another's was green and still call the difference a
  # flake.
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Both sections on every runtime: test/conformance.test.ts is the conformance
      # one and test/adapter.test.ts the adapter one, and the second suite merges
      # the two runs before comparing them to the manifest.
      - name: node
        run: pnpm -C packages/conformance-driver test

      - name: bun
        run: bun run --bun vitest run --project conformance-driver

      - name: workerd
        run: pnpm -C packages/conformance-driver test:workers

      # The adapter section on its own, through the command a host working on an
      # adapter reaches for. Cheap, and it keeps that entry point from rotting.
      - name: adapter section
        run: node packages/conformance-driver/dist/cli.js adapter --package @affiant/adapter-ai-sdk

      # The evidence, not the claim: one run document per runtime, published with
      # the run so a reader can check the manifest rather than take it. Written to
      # a scratch directory so the committed document under
      # packages/conformance-driver/conformance/results/ is never rewritten by CI.
      - name: run documents
        run: |
          node packages/conformance-driver/dist/cli.js \
            --runtime node --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/conformance"
          bun packages/conformance-driver/dist/cli.js \
            --runtime bun --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/conformance"

      - uses: actions/upload-artifact@v7
        with:
          name: conformance-results
          path: ${{ runner.temp }}/conformance
          if-no-files-found: error

  # CV-5: no durability claim rests on a non-`latest` dist-tag of a third-party
  # runtime. The rulebook's own check for it is a lint over an adapter package
  # rather than a fixture, because no fixture can observe a statement about
  # documentation and packaging — and it reads the npm registry, so it runs here,
  # where the package it is about lives, rather than in the rulebook's CI.
  #
  # The script is the vendored one: packages/contract/protocol/ is a byte-for-byte
  # copy of the pinned rulebook ref with a checksum per file, so the script a run
  # is judged by is the script that ref carries, and no cross-repository credential
  # is needed to fetch it.
  #
  # `--offline` is the fallback for a registry the runner cannot reach, and it is
  # reached only on the lint's exit code 2, which means exactly that. A job that
  # retried offline on any failure would swallow the one failure the fallback
  # cannot see — a claim resting on a version `latest` has not reached, which is
  # what the registry half is for — and report CV-5 green for it.
  adapter-claims:
    name: adapter claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: adapter claims (CV-5)
        run: |
          set +e
          node packages/contract/protocol/conformance/lint/adapter-claims.mjs packages/adapter-ai-sdk
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning::the npm registry was unreachable; re-running the claims lint offline"
            node packages/contract/protocol/conformance/lint/adapter-claims.mjs \
              packages/adapter-ai-sdk --offline
          else
            exit "$status"
          fi
