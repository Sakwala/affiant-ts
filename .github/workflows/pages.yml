name: pages

# Publishes the <affiant-evidence-card> demo — the card rendering a v0.1 Evidence
# Card fixture from the protocol rulebook, copied unedited from the pinned ref —
# at https://sakwala.github.io/affiant-ts/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Emits packages/evidence-card/dist (the element) and, from it,
      # packages/evidence-card/demo/dist (the page, the bundled module, the
      # fixture it fetches, and a copy of the built element under element/).
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/evidence-card/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
